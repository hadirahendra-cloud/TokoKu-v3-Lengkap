name: Build TokoKu APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract TokoKu project
        run: |
          mkdir extracted
          unzip -q TokoKu_v3_Lengkap_Siap_Build_APK_HP.zip -d extracted
          cp -R extracted/TokoKu_v3_Android_Project/. .

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TokoKu-v3-Lengkap-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
